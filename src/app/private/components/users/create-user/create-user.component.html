<section class="cliente-list-container">
    <div class="title-container">
        <!-- componente title -->
         <app-title [titleName]="'Create User'" ></app-title>
    </div>
    
    <app-border>
      <form class="card-form" [formGroup]="createUserForm">
        <div class="card-inputs">
    
          <div class="input-container">
            <label for="">Nombre completo</label>
            <input maxlength="20" type="text" formControlName="name" [style]="{'border': createUserForm.get('name')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <div class="input-container">
            <label for="">Telefono</label>
            <input type="phone"  formControlName="phone" [style]="{'border': createUserForm.get('phone')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <div class="input-container">
            <label for="">Cedula de identidad</label>
            <input type="text" formControlName="ci" [style]="{'border': createUserForm.get('ci')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <div class="input-container">
            <label for="">Correo</label>
            <input type="text" formControlName="address" [style]="{'border': createUserForm.get('address')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <div class="input-container">
            <label for="">Contraseña</label>
            <input type="text" formControlName="password" [style]="{'border': createUserForm.get('password')?.getError('required') ? '#ffc3c3 solid 1px' : ''}"/>
          </div>
        </div>
        <div class="card-inputs">
          <div class="input-container">
            <label for="">Apellidos</label>
            <input type="text"  formControlName="lastname" [style]="{'border': createUserForm.get('lastname')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <div class="input-container">
            <label for="">Nombre de usuario</label>
            <input type="text" formControlName="username" [style]="{'border': createUserForm.get('username')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <div class="input-container">
            <label for="">Role</label>
            <select>
              <option value="administrador">Administrador</option>
              <option value="vendedor">Vendedor</option>
            </select>
          </div>
    
          <div class="input-container">
            <label for="">Fecha de nacimiento</label>
            <input type="date" formControlName="birthdate" [style]="{'birthdate': createUserForm.get('name')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <div class="input-container">
            <label for="">Imagen de usuario</label>
            <input type="file" formControlName="photo" [style]="{'border': createUserForm.get('photo')?.getError('required') ? '#ffc3c3 solid 1px' : ''}" />
          </div>
    
          <app-button [buttonName]="'Guardar'" [iconName]="'add'"></app-button>
          <button [disabled]="!!createUserForm.invalid" (click)="enviar()">Enviar</button>
    
          <div class="card-button">
          </div>
        </div>
      </form>
    </app-border>
</section>
