<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-sm p-8 bg-white border border-black rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">SISTEMA DE VENTAS DEV CODE</h2>
    
    <form>
      <!-- Campo Usuario -->
      <label for="username" class="block text-sm font-medium">Usuario</label>
      <input type="text" id="username" placeholder="DevCode" class="w-full p-2 border border-black rounded mb-4" name="username" required>
      
      <!-- Campo Contraseña -->
      <label for="password" class="block text-sm font-medium">Contraseña</label>
      <div class="relative w-full">
        <input
          type="password"
          id="password"
          placeholder="123456.."
          class="w-full p-2 border border-black rounded mb-4"
          name="password"
          required
        >
      </div>
      
      <!-- Botón de Ingresar -->
      <button type="submit" class="w-full bg-black text-white p-2 rounded font-semibold flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12H3m12 0l-3-3m3 3l-3 3m6-8h2a2 2 0 012 2v8a2 2 0 01-2 2h-2" />
        </svg>
        Ingresar
      </button>
    </form>
  </div>
</div>
